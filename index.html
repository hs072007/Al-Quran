<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quran Offline</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6e6e">
<style>
:root{--bg:#f3f6f8;--ink:#14202b;--mute:#5d6b78;--line:#d8e0e6;--acc:#0f6e6e;--card:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e161d;--ink:#e6edf2;--mute:#92a1ad;--line:#243340;--acc:#5fc4c0;--card:#142029;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:2}
header h1{font-size:18px;margin:0;flex:1}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:14px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .n{width:2.2em;color:var(--mute);text-align:right}.row .t{flex:1}.row small{color:var(--mute)}
.ayah{padding:14px 0;border-bottom:1px solid var(--line)}
.ar{font-family:"KFGQPC Uthmani Hafs","Amiri Quran","Scheherazade New","Traditional Arabic",serif;font-size:var(--fs,30px);line-height:2.1;direction:rtl;text-align:right;margin:0}
.tr{color:var(--mute);margin:6px 0 0}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:4px}
.meta button{padding:2px 8px;font-size:13px}
.last{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hide{display:none}
</style></head><body>
<header><button id="back" class="hide" aria-label="Back to surah list">Back</button><h1 id="ttl">Quran Offline</h1><button id="setb">Data</button></header>
<main id="m"></main>
<script>
const S="Al-Fatihah,Al-Baqarah,Ali 'Imran,An-Nisa,Al-Ma'idah,Al-An'am,Al-A'raf,Al-Anfal,At-Tawbah,Yunus,Hud,Yusuf,Ar-Ra'd,Ibrahim,Al-Hijr,An-Nahl,Al-Isra,Al-Kahf,Maryam,Ta-Ha,Al-Anbiya,Al-Hajj,Al-Mu'minun,An-Nur,Al-Furqan,Ash-Shu'ara,An-Naml,Al-Qasas,Al-'Ankabut,Ar-Rum,Luqman,As-Sajdah,Al-Ahzab,Saba,Fatir,Ya-Sin,As-Saffat,Sad,Az-Zumar,Ghafir,Fussilat,Ash-Shura,Az-Zukhruf,Ad-Dukhan,Al-Jathiyah,Al-Ahqaf,Muhammad,Al-Fath,Al-Hujurat,Qaf,Adh-Dhariyat,At-Tur,An-Najm,Al-Qamar,Ar-Rahman,Al-Waqi'ah,Al-Hadid,Al-Mujadilah,Al-Hashr,Al-Mumtahanah,As-Saff,Al-Jumu'ah,Al-Munafiqun,At-Taghabun,At-Talaq,At-Tahrim,Al-Mulk,Al-Qalam,Al-Haqqah,Al-Ma'arij,Nuh,Al-Jinn,Al-Muzzammil,Al-Muddaththir,Al-Qiyamah,Al-Insan,Al-Mursalat,An-Naba,An-Nazi'at,'Abasa,At-Takwir,Al-Infitar,Al-Mutaffifin,Al-Inshiqaq,Al-Buruj,At-Tariq,Al-A'la,Al-Ghashiyah,Al-Fajr,Al-Balad,Ash-Shams,Al-Layl,Ad-Duha,Ash-Sharh,At-Tin,Al-'Alaq,Al-Qadr,Al-Bayyinah,Az-Zalzalah,Al-'Adiyat,Al-Qari'ah,At-Takathur,Al-'Asr,Al-Humazah,Al-Fil,Quraysh,Al-Ma'un,Al-Kawthar,Al-Kafirun,An-Nasr,Al-Masad,Al-Ikhlas,Al-Falaq,An-Nas".split(",");
const C=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const $=id=>document.getElementById(id), m=$("m");
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function db(){return new Promise((res,rej)=>{const r=indexedDB.open("quran",1);r.onupgradeneeded=()=>r.result.createObjectStore("d");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dget(k){const d=await db();return new Promise(r=>{const q=d.transaction("d").objectStore("d").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)})}
async function dput(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction("d","readwrite");t.objectStore("d").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const strip=s=>s.normalize("NFD").replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[\u0622\u0623\u0625\u0671]/g,"\u0627").toLowerCase();
let AR=null,TR=null,TRname="",bm=ls.get("bm",[]),last=ls.get("last",null),fs=ls.get("fs",30),showTr=ls.get("showTr",true);
document.documentElement.style.setProperty("--fs",fs+"px");
function parse(txt){const o={};for(const l of txt.split(/\r?\n/)){if(!l||l[0]=="#")continue;const p=l.split("|");if(p.length<3)continue;const s=+p[0],a=+p[1];if(!s||!a)continue;(o[s]=o[s]||[])[a-1]=p.slice(2).join("|")}return o}
const isAr=t=>/[\u0600-\u06FF]/.test(t.slice(0,2000));
async function load(){AR=await dget("ar")||null;const t=await dget("tr");TR=t?t.data:null;TRname=t?t.name:"";}
function head(t,back){$("ttl").textContent=t;$("back").classList.toggle("hide",!back)}
$("back").onclick=()=>home();$("setb").onclick=()=>settings();
function home(q=""){head("Quran Offline",false);
 let h='<input type="search" id="q" placeholder="Search surah name or number" aria-label="Search surahs">';
 if(!AR)h='<div class="box">No Quran text is stored on this device yet. Open <b>Data</b> and add the text files once. After that the app works fully offline.</div>'+h;
 if(last)h+=`<div class="bar"><button class="p" id="res">Continue: ${S[last.s-1]} ${last.s}:${last.a}</button><button id="bmb">Bookmarks (${bm.length})</button><button id="sb">Search text</button></div>`;
 else h+='<div class="bar"><button id="bmb">Bookmarks ('+bm.length+')</button><button id="sb">Search text</button></div>';
 h+='<div id="l"></div>';m.innerHTML=h;
 const draw=()=>{const v=($("q").value||"").trim().toLowerCase();$("l").innerHTML=S.map((n,i)=>({n,i:i+1})).filter(x=>!v||x.n.toLowerCase().includes(v)||String(x.i)===v).map(x=>`<div class="row" tabindex="0" role="button" data-s="${x.i}"><span class="n">${x.i}</span><span class="t">${x.n}</span><small>${C[x.i-1]} ayahs</small></div>`).join("")};
 $("q").oninput=draw;draw();$("q").value=q;
 $("l").onclick=e=>{const r=e.target.closest(".row");if(r)read(+r.dataset.s)};
 $("l").onkeydown=e=>{if(e.key=="Enter"){const r=e.target.closest(".row");if(r)read(+r.dataset.s)}};
 if($("res"))$("res").onclick=()=>read(last.s,last.a);$("bmb").onclick=bmView;$("sb").onclick=searchView}
function read(s,a){head(`${s}. ${S[s-1]}`,true);
 if(!AR){m.innerHTML='<div class="box">Add the Quran text first (Data).</div>';return}
 let h=`<div class="bar"><button id="fm" aria-label="Smaller text">A-</button><button id="fp" aria-label="Larger text">A+</button>${TR?'<button id="tt">'+(showTr?"Hide":"Show")+' translation</button>':""}</div>`;
 for(let i=0;i<C[s-1];i++){const k=s+":"+(i+1),b=bm.includes(k);
  h+=`<div class="ayah ${last&&last.s==s&&last.a==i+1?"last":""}" id="a${i+1}"><div class="meta"><span>${k}</span><button data-b="${k}">${b?"Bookmarked":"Bookmark"}</button><button data-l="${i+1}">Mark as last read</button></div><p class="ar" lang="ar">${AR[s]?.[i]??""}</p>${TR&&showTr?`<p class="tr">${TR[s]?.[i]??""}</p>`:""}</div>`}
 m.innerHTML=h;
 m.onclick=e=>{const t=e.target;if(t.dataset.b){const k=t.dataset.b;bm=bm.includes(k)?bm.filter(x=>x!=k):[...bm,k];ls.set("bm",bm);t.textContent=bm.includes(k)?"Bookmarked":"Bookmark"}
  if(t.dataset.l){last={s,a:+t.dataset.l};ls.set("last",last);document.querySelectorAll(".last").forEach(x=>x.classList.remove("last"));$("a"+t.dataset.l).classList.add("last")}
  if(t.id=="fp"||t.id=="fm"){fs=Math.max(18,Math.min(64,fs+(t.id=="fp"?4:-4)));ls.set("fs",fs);document.documentElement.style.setProperty("--fs",fs+"px")}
  if(t.id=="tt"){showTr=!showTr;ls.set("showTr",showTr);read(s)}};
 if(!a&&last&&last.s==s)a=last.a;
 if(a){const el=$("a"+a);if(el)el.scrollIntoView()}else scrollTo(0,0)}
function bmView(){head("Bookmarks",true);m.onclick=null;
 m.innerHTML=bm.length?bm.map(k=>{const[s,a]=k.split(":");return`<div class="row" tabindex="0" role="button" data-k="${k}"><span class="t">${S[s-1]} ${k}</span></div>`}).join(""):'<div class="box">No bookmarks yet. Open a surah and choose Bookmark on any ayah.</div>';
 m.onclick=e=>{const r=e.target.closest(".row");if(r){const[s,a]=r.dataset.k.split(":");read(+s,+a)}}}
function searchView(){head("Search text",true);m.onclick=null;
 m.innerHTML='<input type="search" id="q" placeholder="Search Arabic or translation" aria-label="Search text"><div id="r"></div>';
 $("q").oninput=()=>{const v=strip($("q").value.trim());if(v.length<2){$("r").innerHTML="";return}
  const out=[];if(AR)for(const s in AR)AR[s].forEach((t,i)=>{if(out.length<60&&t&&strip(t).includes(v))out.push([s,i+1,t])});
  if(TR)for(const s in TR)TR[s].forEach((t,i)=>{if(out.length<60&&t&&t.toLowerCase().includes(v)&&!out.some(o=>o[0]==s&&o[1]==i+1))out.push([s,i+1,t])});
  $("r").innerHTML=out.length?out.map(o=>`<div class="row" tabindex="0" role="button" data-k="${o[0]}:${o[1]}"><span class="t"><small>${S[o[0]-1]} ${o[0]}:${o[1]}</small><br>${o[2]}</span></div>`).join(""):'<div class="box">No matches. Try a shorter word.</div>'};
 $("r").onclick=e=>{const r=e.target.closest(".row");if(r){const[s,a]=r.dataset.k.split(":");read(+s,+a)}}}
function settings(){head("Data",true);m.onclick=null;
 m.innerHTML=`<div class="box"><p>Add Quran text files in the <code>sura|aya|text</code> format (for example the plain-text downloads from tanzil.net). You do this once; the files are stored on this device.</p>
 <p><b>Arabic text:</b> ${AR?"stored":"not added"}<br><b>Translation:</b> ${TR?"stored ("+TRname+")":"not added"}</p>
 <input type="file" id="f" accept=".txt,text/plain" multiple>
 <p id="msg" role="status"></p></div>
 <div class="box"><b>Offline status:</b> <span id="off">checking</span></div>`;
 $("f").onchange=async e=>{const msg=$("msg");try{for(const f of e.target.files){const o=parse(await f.text());const n=Object.keys(o).length;
  if(n<1){msg.textContent=f.name+": no verses found. Use the Tanzil plain-text format.";continue}
  const first=o[1]&&o[1][0]||"";if(isAr(first)){AR=o;await dput("ar",o)}else{TR=o;TRname=f.name;await dput("tr",{name:f.name,data:o})}
  msg.textContent=`Stored ${f.name} (${n} surahs).`}settings();}catch(err){msg.textContent="Could not store the file: "+err.message}};
 navigator.serviceWorker?.getRegistration().then(r=>{$("off").textContent=r&&r.active?"App files are cached. You can go offline.":"Not cached yet. Open this page once over HTTPS."})}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
navigator.storage?.persist?.();
window.addEventListener("error",e=>{m.insertAdjacentHTML("afterbegin",'<div class="box">Error: '+e.message+'</div>')});
load().catch(()=>{}).then(()=>home());
</script></body></html>
